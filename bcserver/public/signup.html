<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGNUP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="container"  style="max-width: 400px;">
<form>
<center><img src="https://thumbs.dreamstime.com/b/sign-up-icon-button-link-register-signup-online-now-free-login-click-vector-form-233114302.jpg" class="rounded-circle" border="2px" width="100px" height="100px"></center>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Email address</label>
    <input type="email" class="form-control" id="txtemail" aria-describedby="emailHelp">
    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
  </div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Password</label>
    <input type="password" class="form-control" id="txtpwd">
  </div>
<select class="form-select" id="combouser" aria-label="Default select example">
  <option selected>select</option>
  <option value="DONOR">DONOR</option>
  <option value="NEEDY">NEEDY</option>
  <option value="NGO>">NGO></option>
</select>
<br>
 <center><button type="button" id="btnsignup" onclick="doSignupNow()" class="btn btn-primary">Submit</button></center>
</form>
</div>
<script>
  function doSignupNow() {
    let obj = {
        method: "post",
        url: "/do-signup",
        data: {
            email: $("#txtemail").val(),
            pwd: $("#txtpwd").val(),
            utype: $("#combouser").val()
        }
    }

    // AJAX Call
    $.ajax(obj).then(function (response) {
        alert(response);
    }).fail(function (err) {
        alert(JSON.stringify(err.responseText));
    })
     }
</script>
</body>
</html>
