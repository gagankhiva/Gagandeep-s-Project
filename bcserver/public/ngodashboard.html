<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NGO Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<script>
     function dologout()
 {
    localStorage.removeItem("activeuser");
    location.href="/"
 }
</script>
<body>

<nav class="navbar bg-primary-subtle border-bottom">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/ngodash">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/042/048/447/small/blood-donation-for-foundation-or-medical-logo-design-illustration-idea-vector.jpg" alt="Logo" width="40" height="40" class="me-2">
            NGO>
        </a>
    </div>
</nav>

<div class="container my-4">
    <h3 class="text-center mb-4">NGO Dashboard</h3>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card h-100 text-center">
                <div class="card-body">
                    <h5 class="card-title">Profile</h5>
                   <img src="https://cdn-icons-png.flaticon.com/512/11748/11748483.png" class="card-img-top p-3" alt="Profile">
                </div>
                <div class="card-footer bg-white border-0 pb-3">
                    <a href="/ngoregisteration" class="btn btn-primary w-100">Open</a>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card h-100 text-center">
                <div class="card-body">
                    <h5 class="card-title">Find Equipments</h5>
                 <img src="https://thumbs.dreamstime.com/b/check-list-ok-icon-search-glass-gear-symbol-icon-template-check-list-ok-icon-free-vector-icon-vector-eps-illustration-123825517.jpg" class="card-img-top p-3" alt="Find Equipments">
                </div>
                <div class="card-footer bg-white border-0 pb-3">
                    <a href="/searchequipments" class="btn btn-primary w-100">Open</a>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card h-100 text-center">
                <div class="card-body">
                    <h5 class="card-title">Logout</h5>
                   <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjFZLp8hInCX9ohqw5_L1ynKKxgPnRagaxegtEU0wRnZ8dH22r40EGOqg&s=10" class="card-img-top p-3" alt="Logout">
                </div>
                <div class="card-footer bg-white border-0 pb-3">
                    <a href="#" onclick="dologout();" class="btn btn-danger w-100">Logout</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
