<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>NGO Registration</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

          <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<script>
$(document).ready(function () {
$("#inputEmail4").val(localStorage.getItem("activeuser")).prop("readonly",true);
    $("#btnFetch").click(function () {

        let obj = {
            method: "post",
            url: "/fetch-ngo",
            data: {
                email: $("#inputEmail4").val()
            }
        };

        $.ajax(obj).then(function (response) {

            if (response.length == 0) {
                alert("Emailid not found");
                return;
            }

            let row = response[0];
    
            $("#ngoName").val(row.ngoname);
            $("#regno").val(row.regno);
            $("#typee").val(row.typee);
            $("#address").val(row.address);
            $("#city").val(row.city);
            $("#president").val(row.president);
            $("#contact").val(row.contact);
            $("#website").val(row.website);

            $("#preview").prop("src", row.picurl);

        }).fail(function (err) {
            alert(JSON.stringify(err.responseText));
        });

    });

    
    $("#filePic").change(function () {
        let file = this.files[0];
        if (file)
            $("#preview").prop("src", URL.createObjectURL(file));
    });

});
</script>
<body>
    <div class="container mt-4" style="max-width: 800px;">

        <h2 class="text-center mb-4">NGO> REGISTRATION</h2>

        <form enctype="multipart/form-data">

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="inputEmail4">Email</label>
                    <input type="email" class="form-control" id="inputEmail4" name="email">
                    <button type="button" id="btnFetch" class="btn btn-primary"> FETCH </button>
                </div>

                <div class="form-group col-md-6">
                    <label for="ngoName">NGO Name</label>
                    <input type="text" class="form-control" id="ngoName" name="ngoname">
                </div>
            </div>

            <div class="form-group">
                <label for="regno">NGO Registration Number</label>
                <input type="text"
                       class="form-control"
                       id="regno"
                       name="regno"
                       >
            </div>

            <div class="form-group">
                <label for="typee">NGO Type</label>
                <select id="typee" name="typee" class="form-control">
                    <option value="">Choose...</option>
                    <option value="TRUST">TRUST</option>
                    <option value="SOCIETY">SOCIETY</option>
                </select>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="address" name="address">
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="city">City</label>
                    <input type="text"
                           class="form-control"
                           id="city"
                           name="city">
                </div>

                <div class="form-group col-md-6">
                    <label for="president">President</label>
                    <input type="text"
                           class="form-control"
                           id="president"
                           name="president">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="contact">Contact Number</label>
                    <input type="text"
                           class="form-control"
                           id="contact"
                           name="contact">
                </div>

                <div class="form-group col-md-6">
                    <label for="website">Website</label>
                    <input type="text" class="form-control" id="website" name="website">
                </div>
            </div>
            <div>
                 <input type="file" id="filePic"  name="filePic" accept="image/*">
                 <img src="" id="preview" width="100" height="100" alt="">
            </div>
            <button type="submit" formaction="/save-ngo" formmethod="POST" class="btn btn-primary"> Save NGO </button>

            <button type="submit" class="btn btn-primary" formaction="/update-ngo" formmethod="POST"> UPDATE </button>

        </form>
    </div>
</body>
</html>
