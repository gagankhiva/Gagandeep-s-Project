<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipment Availability</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<script>
$(document).ready(function () {
    $("#emailid").val(localStorage.getItem("activeuser")).prop("readonly",true);
    // show selected image in the box
    $("#filePic").change(function () {
        let file = this.files[0];
        if (file)
            $("#preview").prop("src", URL.createObjectURL(file));
    });
});
</script>
<body>
<div class="container mt-4" style="max-width: 800px;">

    <h2 class="text-center mb-4">Equipment Availability</h2>

    <form action="/avail-equipment" method="post" enctype="multipart/form-data">

        <div class="form-row">

            
            <div class="form-group col-md-5">
                <img src="" id="preview" class="border d-block mb-2" width="200" height="200" alt="">
                <label for="filePic">Select Image</label>
                <input type="file" class="form-control-file" id="filePic" name="filePic" accept="image/*">
            </div>

            
            <div class="col-md-7">
                <div class="form-group">
                    <label for="emailid">Donor Email Id</label>
                    <input type="email" class="form-control" id="emailid" name="emailid" required>
                </div>

                <div class="form-group">
                    <label for="category">Equipment Category</label>
                    <select id="category" name="category" class="form-control" required>
                        <option value="">Choose...</option>
                        <option>Health Monitors</option>
                        <option>Glucometers and Diabetes Supplies</option>
                        <option>Mobility Aids</option>
                        <option>Orthopaedic Braces and Supports</option>
                        <option>Posture Correctors</option>
                        <option>Compression Garments</option>
                        <option>Post-Surgery and Maternity Belts</option>
                        <option>First Aid and Wound Care</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Avail Now</button>
            </div>
        </div>
    </form>
</div>
</body>

</html>
