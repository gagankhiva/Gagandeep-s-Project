<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(document).ready(function () {

            $("#btnLogin").click(function () {

                let obj = {
                    method: "post",
                    url: "/do-login",
                    data: {
                        email: $("#email").val(),
                        pwd: $("#pwd").val()
                    }
                };

                $.ajax(obj).then(function (response) {
                    localStorage.setItem("activeuser",$("#email").val());
                    alert(response);
                    if (response == "DONOR")
                        location.href = "/donordash";   
                    else if (response == "NEEDY")
                        location.href = "/needydash";  
                    else if (response == "NGO>")
                        location.href = "/ngodash"; 
                    else
                        $("#msg").text(response);        
                }).fail(function (err) {
                    $("#msg").text(err.responseText);
                });
            });

        });
    </script>
</head>

<body class="bg-light">


<nav class="navbar bg-primary-subtle border-bottom">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/042/048/447/small/blood-donation-for-foundation-or-medical-logo-design-illustration-idea-vector.jpg" alt="Logo" width="40" height="40" class="me-2">
            NGO>
        </a>
    </div>
</nav>


<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">

            <div class="card shadow-sm">
                <div class="card-header text-center">
                    <h4 class="m-0">Login</h4>
                </div>
                <div class="card-body">

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Id</label>
                        <input type="email" class="form-control" id="email">
                    </div>

                    <div class="mb-3">
                        <label for="pwd" class="form-label">Password</label>
                        <input type="password" class="form-control" id="pwd">
                    </div>

                    <button type="button" id="btnLogin" class="btn btn-primary w-100">Login</button>

                    <p id="msg" class="text-danger text-center mt-3 mb-0"></p>
                </div>
               
            </div>

        </div>
    </div>
</div>

</body>
</html>
