<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipment Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule = angular.module("finderModule", []);
        myModule.controller("finderController", function ($scope, $http) {

            $scope.cities = [];
            $scope.categories = [];
            $scope.selCity = "";
            $scope.selCategory = "";
            $scope.jsonAry = [];


            $scope.loadDistCities = function () {
                $http.get("/get-dist-cities").then(function (resp) {
                    $scope.cities = resp.data;
                }, function (err) {
                    alert(JSON.stringify(err));
                });
            }
           

            $scope.doShowDonor = function (emailid) {
               
                $http.get("/get-donor?txtEmail=" + emailid).then(function (resp) {
                    $scope.donor = resp.data[0];
                }, function (err) {
                    alert(JSON.stringify(err));
                });
            }

            $scope.fillCategories = function () {
                $http.get("/get-dist-categories").then(function (resp) {
                    $scope.categories = resp.data;
                }, function (err) {
                    alert(JSON.stringify(err));
                });
            }
            $scope.doFind = function () {
                let url = "/find-equipments?city=" + $scope.selCity + "&category=" + $scope.selCategory;
                $http.get(url).then(function (resp) {
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(JSON.stringify(err));
                });
            }
        });
    </script>
</head>

<body ng-app="finderModule" ng-controller="finderController" ng-init="loadDistCities(); fillCategories();">
    <div class="modal fade" id="donorModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Donor Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p><strong>Name:</strong> {{donor.name}}</p>
                    <p><strong>Email:</strong> {{donor.emailid}}</p>
                    <p><strong>Contact:</strong> {{donor.contact}}</p>
                    <p><strong>Address:</strong> {{donor.address}}</p>
                    <p><strong>Area:</strong> {{donor.region}}, {{donor.district}} - {{donor.pin}}</p>
                    <p class="mb-0"><strong>Contact Hours:</strong> {{donor.hfrom}} to {{donor.htoo}}</p>
                </div>
                

            </div>
        </div>
    </div>

    <nav class="navbar bg-primary-subtle border-bottom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/042/048/447/small/blood-donation-for-foundation-or-medical-logo-design-illustration-idea-vector.jpg"
                    alt="Logo" width="40" height="40" class="me-2">
                NGO>
            </a>
        </div>
    </nav>

    <div class="container my-4">

        <h3 class="text-center mb-4">Equipment Finder</h3>


        <div class="row g-3 mb-4 align-items-end">

            <div class="col-12 col-md-4">
                <label class="form-label">City</label>
                <select class="form-select" ng-model="selCity">
                    <option value="">Select Cities</option>
                    <option ng-repeat="obj in cities" value="{{obj.district}}">{{obj.district}}</option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <label class="form-label">Category</label>
                <select class="form-select" ng-model="selCategory">
                    <option value="">Select Category</option>
                    <option ng-repeat="obj in categories" value="{{obj.category}}">{{obj.category}}</option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <button type="button" class="btn btn-primary w-100" ng-click="doFind();">Find Equipments</button>
            </div>

        </div>

        <div class="row g-4">
            <div class="col-12 col-sm-6 col-lg-3" ng-repeat="obj in jsonAry">
                <div class="card h-100 text-center">
                    <img ng-src="{{obj.picurl}}" class="card-img-top object-fit-cover" height="200" alt="Equipment">
                    <div class="card-body">
                        <h5 class="card-title">{{obj.category}}</h5>
                        <p class="card-text">{{obj.emailid}}</p>
                        <div class="card-footer bg-white border-0 pb-3">
                            <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal"
                                data-bs-target="#donorModal" ng-click="doShowDonor(obj.emailid);">
                                Contact Donor
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
