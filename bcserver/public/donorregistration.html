<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donor Registration</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<script>
$(document).ready(function () {
$("#email").val(localStorage.getItem("activeuser")).prop("readonly",true);
    
    $("#pin").blur(function () {
        let pin = $("#pin").val().trim();

        let obj = {
            method: "get",
            url: "https://api.postalpincode.in/pincode/" + pin
        };

        $.ajax(obj).then(function (response) {
            if (response[0].Status != "Success") {
                alert("Invalid PIN code");
                $("#region").val("");
                $("#district").val("");
                return;
            }
            let po = response[0].PostOffice[0];
            $("#region").val(po.Name);
            $("#district").val(po.District);
        }).fail(function () {
            alert("Could not fetch PIN details");
        });
    });


    
    $("#btnFetch").click(function () {

        let obj = {
            method: "post",
            url: "/fetch-donor",
            data: {
                email: $("#email").val()
            }
        };

        $.ajax(obj).then(function (response) {

            if (response.length == 0) {
                alert("Emailid not found");
                return;
            }

            let row = response[0];
            $("#name").val(row.name);
            $("#address").val(row.address);
            $("#adhaar").val(row.adhaar);
            $("#pin").val(row.pin);
            $("#region").val(row.region);
            $("#district").val(row.district);
            $("#contact").val(row.contact);
            $("#hfrom").val(row.hfrom);
            $("#hto").val(row.htoo);       

        }).fail(function (err) {
            alert(err.responseText);
        });
    });


   
    $("#btnSave").click(function () {

        let obj = {
            method: "post",
            url: "/save-donor",
            data: $("#donorForm").serialize()
        };

        $.ajax(obj).then(function (response) {
            alert(response);
        }).fail(function (err) {
            alert(err.responseText);
        });
    });


    
    $("#btnUpdate").click(function () {

        let obj = {
            method: "post",
            url: "/update-donor",
            data: $("#donorForm").serialize()
        };

        $.ajax(obj).then(function (response) {
            alert(response);
        }).fail(function (err) {
            alert(err.responseText);
        });
    });

});
</script>
<body>
<div class="container mt-4" style="max-width: 800px;">

    <h2 class="text-center mb-4">Donor Registration </h2>

    <form id="donorForm">

       
        <div class="form-row">
            <div class="form-group col-md-8">
                <label for="email">Email Id</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="form-group col-md-4 d-flex align-items-end">
                <button type="button" id="btnFetch" class="btn btn-primary">Fetch</button>
            </div>
        </div>

       
        <div class="form-row">
            <div class="form-group col-md-4">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" name="name">
            </div>
            <div class="form-group col-md-4">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="address" name="address">
            </div>
            <div class="form-group col-md-4">
                <label for="adhaar">Adhaar Card No.</label>
                <input type="text" class="form-control" id="adhaar" name="adhaar" >
            </div>
        </div>

        
        <div class="form-row">
            <div class="form-group col-md-3">
                <label for="pin">PIN Code</label>
                <input type="text" class="form-control" id="pin" name="pin" >
            </div>
            <div class="form-group col-md-3">
                <label for="region">Area</label>
                <input type="text" class="form-control" id="region" name="region" readonly>
            </div>
            <div class="form-group col-md-3">
                <label for="contact">Contact Number</label>
                <input type="text" class="form-control" id="contact" name="contact">
            </div>
            <div class="form-group col-md-3">
                <label for="district">District</label>
                <input type="text" class="form-control" id="district" name="district" readonly>
            </div>
        </div>

       
        <div class="form-row">
            <div class="form-group col-md-3">
                <label for="hfrom">Contact Hours from</label>
                <select id="hfrom" name="hfrom" class="form-control">
                    <option value="">Choose...</option>
                    <option>9 am</option>
                    <option>10 am</option>
                    <option>11 am</option>
                    <option>12 pm</option>
                </select>
            </div>
            <div class="form-group col-md-3">
                <label for="hto">to</label>
                <select id="hto" name="hto" class="form-control">
                    <option value="">Choose...</option>
                    <option>1 pm</option>
                    <option>2 pm</option>
                    <option>3 pm</option>
                    <option>4 pm</option>
                    <option>5 pm</option>
                </select>
            </div>
        </div>

        
        <button type="button" id="btnSave" class="btn btn-primary">Save</button>
        <button type="button" id="btnUpdate" class="btn btn-primary">Update</button>
    </form>
</div>


</body>
</html>
