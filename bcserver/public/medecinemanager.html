<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Med. Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

    <script>
        let myModule = angular.module("medModule", []);
        myModule.controller("medController", function ($scope, $http) {
            $scope.email = "";
             $scope.email = localStorage.getItem("activeuser");
            $scope.jsonAry = [];

           
            $scope.doLoad = function () {
                let url = "/get-medicines?txtEmail=" + $scope.email;
                $http.get(url).then(function (resp) {
                    $scope.jsonAry = resp.data;
                }, function (err) {
                    alert(JSON.stringify(err));
                });
            }

           
            $scope.doRemove = function (rid) {
                if (!confirm("Are you sure you want to remove this medicine?"))
                    return;

                let url = "/delete-medicine?rid=" + rid;
                $http.get(url).then(function (resp) {
                    alert(resp.data);
                    $scope.doLoad();
                }, function (err) {
                    alert(JSON.stringify(err));
                });
            }
        });
    </script>
</head>

<body ng-app="medModule" ng-controller="medController">

    
    <nav class="navbar bg-primary-subtle border-bottom">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/donordash">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/042/048/447/small/blood-donation-for-foundation-or-medical-logo-design-illustration-idea-vector.jpg"
                    alt="Logo" width="40" height="40" class="me-2">
                NGO>
            </a>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 800px;">

        <h3 class="text-center mb-4">Med. Manager</h3>

     
        <div class="row g-2 mb-4">
            <div class="col-12 col-md-8">
                <input type="email" class="form-control" ng-model="email" readonly>
            </div>
            <div class="col-12 col-md-4">
                <button type="button" class="btn btn-primary w-100" ng-click="doLoad();">Load All Med.</button>
            </div>
        </div>

      
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" ng-repeat="obj in jsonAry">
                <span>
                    {{$index + 1}}. {{obj.medecine}} ({{obj.power}} mg) |
                    Company: {{obj.company}} |
                    Qty: {{obj.qty}} |
                    Packing: {{obj.packing}} |
                    Expiry: {{obj.doexp}}
                </span>
                <button type="button" class="btn btn-danger btn-sm" ng-click="doRemove(obj.rid);">Remove</button>
            </li>
        </ul>

    </div>

</body>

</html>
